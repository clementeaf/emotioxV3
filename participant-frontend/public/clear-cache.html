<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache - EmotioX</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            background: #f0f0f0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🧹 Clear All Caches</h1>
    <p>This page will unregister all service workers and clear all cached data.</p>
    
    <div id="status" class="status">
        <p>Ready to clear cache...</p>
    </div>
    
    <button onclick="clearEverything()">Clear Cache & Reload</button>
    
    <script>
        async function clearEverything() {
            const statusDiv = document.getElementById('status');
            
            try {
                statusDiv.innerHTML = '<p>🗑️ Unregistering service workers...</p>';
                
                // Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                        console.log('Unregistered SW:', registration.scope);
                    }
                }
                
                statusDiv.innerHTML = '<p>🗑️ Clearing all caches...</p>';
                
                // Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        console.log('Deleted cache:', cacheName);
                    }
                }
                
                // Clear local storage
                localStorage.clear();
                sessionStorage.clear();
                
                statusDiv.className = 'status success';
                statusDiv.innerHTML = '<p>✅ All caches cleared successfully!</p><p>Redirecting to home page...</p>';
                
                // Redirect to root after 2 seconds
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `<p>❌ Error: ${error.message}</p>`;
            }
        }
        
        // Auto-clear on load if ?auto=1 is in URL
        if (window.location.search.includes('auto=1')) {
            clearEverything();
        }
    </script>
</body>
</html>
