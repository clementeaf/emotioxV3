service: emotioxv3-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${env:API_STAGE, 'dev'}
  timeout: 60
  memorySize: 1024
  environment:
    DB_HOST: ${env:DB_HOST}
    DB_PORT: ${env:DB_PORT}
    DB_NAME: ${env:DB_NAME}
    DB_USER: ${env:DB_USER}
    DB_SSL: ${env:DB_SSL}
    APP_AWS_REGION: ${env:APP_AWS_REGION}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME}
    CORS_ORIGIN: ${env:CORS_ORIGIN}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    COGNITO_DOMAIN: ${env:COGNITO_DOMAIN, ''}
    # COGNITO_CLIENT_SECRET is loaded at runtime from SSM SecureString
    SSM_PREFIX: /emotioxv3/${self:provider.stage}
    SSM_REGION: ${env:AWS_REGION, 'us-east-1'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - "arn:aws:s3:::${env:S3_BUCKET_NAME}/*"
            - "arn:aws:s3:::emotioxv3-media-*/*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminUpdateUserAttributes
          Resource: "arn:aws:cognito-idp:${self:provider.region}:*:userpool/*"
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
          Resource: "*"
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - "arn:aws:ssm:${self:provider.region}:${aws:accountId}:parameter/emotioxv3/${self:provider.stage}/*"
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource: "arn:aws:execute-api:*:*:**/@connections/*"

functions:
  api:
    handler: dist/handler.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true
  monitor:
    handler: dist/modules/monitor/handler.handleSocket
    runtime: nodejs20.x
    events:
      - websocket:
          route: $connect
      - websocket:
          route: $disconnect
      - websocket:
          route: $default

plugins:
  - serverless-offline
  - serverless-domain-manager

custom:
  customDomain:
    domainName: server.emotiox.org
    basePath: ''
    stage: ${self:provider.stage}
    certificateArn: ${env:ACM_CERTIFICATE_ARN}
    createRoute53Record: false
    createRoute53IPv6Record: false
    endpointType: 'regional'
    securityPolicy: tls_1_2
    apiType: rest
    autoDomain: true
