name: Deploy Participant Frontend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'participant-frontend/**'
      - '.github/workflows/deploy-participant-frontend-cpanel.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: participant-frontend/package-lock.json

      - name: Install dependencies
        working-directory: participant-frontend
        run: npm ci

      - name: Clean previous build
        working-directory: participant-frontend
        run: rm -rf dist node_modules/.vite

      - name: Configure runtime-config.json
        working-directory: participant-frontend
        run: |
          cat > public/runtime-config.json << 'EOF'
          {
            "apiBaseUrl": "https://emotio.cx/api"
          }
          EOF

      - name: Build for production
        working-directory: participant-frontend
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.CPANEL_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup on remote server
        run: |
          ssh ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} '
            REMOTE_DIR="$HOME/public_html/participant"
            if [ -d "$REMOTE_DIR" ]; then
              BACKUP_DIR="${REMOTE_DIR}.backup.$(date +%Y%m%d_%H%M%S)"
              cp -r "$REMOTE_DIR" "$BACKUP_DIR"
              echo "✅ Backup creado: $BACKUP_DIR"
            else
              mkdir -p "$REMOTE_DIR"
              echo "✅ Directorio creado"
            fi
          '

      - name: Clean remote directory
        run: |
          ssh ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} '
            REMOTE_DIR="$HOME/public_html/participant"
            cd "$REMOTE_DIR" || exit 1
            find . -mindepth 1 ! -name ".well-known" ! -name "cgi-bin" -exec rm -rf {} + 2>/dev/null || true
            echo "✅ Directorio limpiado"
          '

      - name: Deploy files to cPanel
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='*.ts' \
            --exclude='*.tsx' \
            --exclude='tsconfig*.json' \
            --exclude='vite.config.ts' \
            --exclude='package*.json' \
            --exclude='.env*' \
            --exclude='.gitignore' \
            --exclude='eslint.config.js' \
            --exclude='tailwind.config.js' \
            --exclude='postcss.config.js' \
            participant-frontend/dist/ \
            ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:~/public_html/participant/

      - name: Deploy runtime-config.json
        run: |
          scp participant-frontend/public/runtime-config.json \
            ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:~/public_html/participant/runtime-config.json

      - name: Configure .htaccess
        run: |
          ssh ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} "cat > ~/public_html/participant/.htaccess" << 'HTACCESS_EOF'
          # Apache configuration for React Router (SPA)
          # Redirects all requests to index.html except for existing files

          <IfModule mod_rewrite.c>
            RewriteEngine On
            
            # Handle React Router - redirect all requests to index.html
            # except for files that actually exist
            
            # Explicitly allow .json files (like runtime-config.json)
            RewriteRule \.json$ - [L]
            
            # If the requested file exists, serve it
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            
            # Otherwise, redirect to index.html
            RewriteRule ^ index.html [L]
          </IfModule>

          # Security headers
          <IfModule mod_headers.c>
            # Prevent clickjacking
            Header always set X-Frame-Options "SAMEORIGIN"
            
            # XSS Protection
            Header always set X-XSS-Protection "1; mode=block"
            
            # Content type options
            Header always set X-Content-Type-Options "nosniff"
            
            # Referrer policy
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>

          # Cache control for static assets
          <IfModule mod_expires.c>
            ExpiresActive On
            
            # Images
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            
            # Fonts
            ExpiresByType font/woff "access plus 1 year"
            ExpiresByType font/woff2 "access plus 1 year"
            ExpiresByType font/ttf "access plus 1 year"
            ExpiresByType font/otf "access plus 1 year"
            
            # CSS and JavaScript (hashed files can be cached)
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            
            # HTML should not be cached
            ExpiresByType text/html "access plus 0 seconds"
          </IfModule>

          # Gzip compression
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
          </IfModule>
          HTACCESS_EOF

      - name: Verify deployment
        run: |
          REMOTE_FILES=$(ssh ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} 'ls -1 "$HOME/public_html/participant" 2>/dev/null | wc -l')
          echo "Archivos en remoto: $REMOTE_FILES"
          if [ "$REMOTE_FILES" -gt 0 ]; then
            echo "✅ Despliegue exitoso"
          else
            echo "⚠️  Advertencia: No se encontraron archivos en el directorio remoto"
            exit 1
          fi
