name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-changes:
    name: Check for backend changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Check for changes in backend
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(backend/|\.github/workflows/deploy-backend\.yml)'; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Backend changes detected"
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "No backend changes detected"
          fi
        continue-on-error: false

  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    needs: check-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.check-changes.outputs.has-changes == 'true'
    env:
      HUSKY: "0"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate required SSM parameters exist (production)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: ${{ secrets.DB_SSL }}
          APP_AWS_REGION: ${{ secrets.APP_AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
        run: |
          set -euo pipefail
          echo "AWS region: ${AWS_REGION}"
          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "AWS account: ${AWS_ACCOUNT_ID}"
          PREFIX="/emotioxv3/production"
          echo "Validating SSM parameters under ${PREFIX}..."
          # Do not print values; only validate existence.
          NAMES=(
            "${PREFIX}/DB_HOST"
            "${PREFIX}/DB_PORT"
            "${PREFIX}/DB_NAME"
            "${PREFIX}/DB_USER"
            "${PREFIX}/DB_PASSWORD"
            "${PREFIX}/DB_SSL"
            "${PREFIX}/APP_AWS_REGION"
            "${PREFIX}/S3_BUCKET_NAME"
            "${PREFIX}/CORS_ORIGIN"
            "${PREFIX}/COGNITO_USER_POOL_ID"
            "${PREFIX}/COGNITO_CLIENT_ID"
          )
          
          # AWS SSM GetParameters has a hard limit of 10 names per call.
          INVALID_JSON="[]"
          TOTAL="${#NAMES[@]}"
          INDEX=0
          while [ "${INDEX}" -lt "${TOTAL}" ]; do
            CHUNK=( "${NAMES[@]:${INDEX}:10}" )
            aws ssm get-parameters --region "${AWS_REGION}" --names "${CHUNK[@]}" --output json > ssm-params.json
            INVALID_JSON="$(INVALID_JSON="${INVALID_JSON}" python3 -c 'import json,os; prev=json.loads(os.environ.get("INVALID_JSON","[]")); cur=(json.load(open("ssm-params.json","r",encoding="utf-8")).get("InvalidParameters",[]) or []); merged=sorted(set(prev).union(cur)); print(json.dumps(merged))')"
            INDEX=$((INDEX + 10))
          done

          INVALID_COUNT="$(INVALID_JSON="${INVALID_JSON}" python3 -c 'import json,os; v=json.loads(os.environ.get("INVALID_JSON","[]")); print(len(v))')"
          if [ "${INVALID_COUNT}" != "0" ]; then
            echo "Missing SSM parameters (count=${INVALID_COUNT}). Attempting bootstrap from GitHub Secrets..."

            missing_basenames="$(INVALID_JSON="${INVALID_JSON}" python3 -c 'import json,os; v=json.loads(os.environ.get("INVALID_JSON","[]")); print(" ".join([p.split("/")[-1] for p in v]))')"

            for key in ${missing_basenames}; do
              case "${key}" in
                DB_PASSWORD)
                  [ -n "${DB_PASSWORD:-}" ] || { echo "Missing GitHub Secret: DB_PASSWORD"; exit 1; }
                  aws ssm put-parameter --region "${AWS_REGION}" --name "${PREFIX}/DB_PASSWORD" --type "SecureString" --value "${DB_PASSWORD}" --overwrite > /dev/null
                  ;;
                DB_HOST|DB_PORT|DB_NAME|DB_USER|DB_SSL|APP_AWS_REGION|S3_BUCKET_NAME|CORS_ORIGIN|COGNITO_USER_POOL_ID|COGNITO_CLIENT_ID)
                  value="$(printenv "${key}" || true)"
                  if [ -z "${value}" ]; then
                    case "${key}" in
                      APP_AWS_REGION) value="${AWS_REGION}" ;;
                      DB_SSL) value="true" ;;
                      CORS_ORIGIN) value="https://research.useremotion.com" ;;
                      *) echo "Missing GitHub Secret: ${key}"; exit 1 ;;
                    esac
                  fi
                  aws ssm put-parameter --region "${AWS_REGION}" --name "${PREFIX}/${key}" --type "String" --value "${value}" --overwrite > /dev/null
                  ;;
                *)
                  echo "Unknown missing SSM key: ${key}"
                  exit 1
                  ;;
              esac
            done

            echo "Bootstrap complete. Re-validating SSM parameters..."
            INVALID_JSON="[]"
            TOTAL="${#NAMES[@]}"
            INDEX=0
            while [ "${INDEX}" -lt "${TOTAL}" ]; do
              CHUNK=( "${NAMES[@]:${INDEX}:10}" )
              aws ssm get-parameters --region "${AWS_REGION}" --names "${CHUNK[@]}" --output json > ssm-params.json
              INVALID_JSON="$(INVALID_JSON="${INVALID_JSON}" python3 -c 'import json,os; prev=json.loads(os.environ.get("INVALID_JSON","[]")); cur=(json.load(open("ssm-params.json","r",encoding="utf-8")).get("InvalidParameters",[]) or []); merged=sorted(set(prev).union(cur)); print(json.dumps(merged))')"
              INDEX=$((INDEX + 10))
            done

            INVALID_COUNT="$(INVALID_JSON="${INVALID_JSON}" python3 -c 'import json,os; v=json.loads(os.environ.get("INVALID_JSON","[]")); print(len(v))')"
            if [ "${INVALID_COUNT}" != "0" ]; then
              echo "Missing SSM parameters after bootstrap (count=${INVALID_COUNT}). InvalidParameters:"
              INVALID_JSON="${INVALID_JSON}" python3 -c 'import json,os; v=json.loads(os.environ.get("INVALID_JSON","[]")); print(json.dumps(v, indent=2))'
              exit 1
            fi
          fi
          echo "SSM parameters OK."

      - name: Deploy to AWS Lambda
        working-directory: backend
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          API_STAGE: production
        run: |
          npx serverless deploy --stage production

      - name: Publish runtime-config.json to frontend buckets
        working-directory: backend
        env:
          RESEARCH_FRONTEND_S3_BUCKET: ${{ secrets.RESEARCH_FRONTEND_S3_BUCKET }}
          PARTICIPANT_FRONTEND_S3_BUCKET: ${{ secrets.PARTICIPANT_FRONTEND_S3_BUCKET }}
          RESEARCH_FRONTEND_CLOUDFRONT_ID: ${{ secrets.RESEARCH_FRONTEND_CLOUDFRONT_ID }}
          PARTICIPANT_FRONTEND_CLOUDFRONT_ID: ${{ secrets.PARTICIPANT_FRONTEND_CLOUDFRONT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RESEARCH_FRONTEND_S3_BUCKET}" ] || [ -z "${PARTICIPANT_FRONTEND_S3_BUCKET}" ]; then
            echo "Missing frontend S3 bucket secrets (RESEARCH_FRONTEND_S3_BUCKET / PARTICIPANT_FRONTEND_S3_BUCKET)"
            exit 1
          fi

          echo "Resolving deployed API base URL from CloudFormation stack output..."
          STACK_NAME="emotioxv3-backend-production"
          API_BASE_URL="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceEndpoint'].OutputValue | [0]" \
            --output text)"

          if [ -z "${API_BASE_URL}" ]; then
            echo "Failed to resolve API base URL from CloudFormation output for stack: ${STACK_NAME}"
            exit 1
          fi

          echo "API base URL: ${API_BASE_URL}"
          
          RESEARCH_BASE_URL=""
          PARTICIPANT_BASE_URL=""
          if [ -n "${RESEARCH_FRONTEND_CLOUDFRONT_ID:-}" ]; then
            RESEARCH_DOMAIN="$(aws cloudfront get-distribution --id "${RESEARCH_FRONTEND_CLOUDFRONT_ID}" --query "Distribution.DomainName" --output text 2>/dev/null || true)"
            if [ -n "${RESEARCH_DOMAIN}" ] && [ "${RESEARCH_DOMAIN}" != "None" ]; then
              RESEARCH_BASE_URL="https://${RESEARCH_DOMAIN}"
            fi
          fi
          if [ -n "${PARTICIPANT_FRONTEND_CLOUDFRONT_ID:-}" ]; then
            PARTICIPANT_DOMAIN="$(aws cloudfront get-distribution --id "${PARTICIPANT_FRONTEND_CLOUDFRONT_ID}" --query "Distribution.DomainName" --output text 2>/dev/null || true)"
            if [ -n "${PARTICIPANT_DOMAIN}" ] && [ "${PARTICIPANT_DOMAIN}" != "None" ]; then
              PARTICIPANT_BASE_URL="https://${PARTICIPANT_DOMAIN}"
            fi
          fi

          python3 - <<'PY'
import json
import os

payload = {
  "apiBaseUrl": os.environ["API_BASE_URL"],
}

research_base = os.environ.get("RESEARCH_BASE_URL", "").strip()
participant_base = os.environ.get("PARTICIPANT_BASE_URL", "").strip()
if research_base:
  payload["researchBaseUrl"] = research_base
if participant_base:
  payload["participantBaseUrl"] = participant_base

with open("runtime-config.json", "w", encoding="utf-8") as f:
  json.dump(payload, f)
  f.write("\n")
PY

          echo "Uploading runtime-config.json to frontend buckets..."
          aws s3 cp runtime-config.json "s3://${RESEARCH_FRONTEND_S3_BUCKET}/runtime-config.json" --cache-control "no-store, max-age=0"
          aws s3 cp runtime-config.json "s3://${PARTICIPANT_FRONTEND_S3_BUCKET}/runtime-config.json" --cache-control "no-store, max-age=0"

          if [ -n "${RESEARCH_FRONTEND_CLOUDFRONT_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "${RESEARCH_FRONTEND_CLOUDFRONT_ID}" --paths "/runtime-config.json"
          fi
          if [ -n "${PARTICIPANT_FRONTEND_CLOUDFRONT_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "${PARTICIPANT_FRONTEND_CLOUDFRONT_ID}" --paths "/runtime-config.json"
          fi
