name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate required SSM parameters exist (production)
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          PREFIX="/emotioxv3/production"
          echo "Validating SSM parameters under ${PREFIX}..."
          # Do not print values; only validate existence.
          NAMES=(
            "${PREFIX}/DB_HOST"
            "${PREFIX}/DB_PORT"
            "${PREFIX}/DB_NAME"
            "${PREFIX}/DB_USER"
            "${PREFIX}/DB_PASSWORD"
            "${PREFIX}/DB_SSL"
            "${PREFIX}/APP_AWS_REGION"
            "${PREFIX}/S3_BUCKET_NAME"
            "${PREFIX}/CORS_ORIGIN"
            "${PREFIX}/COGNITO_USER_POOL_ID"
            "${PREFIX}/COGNITO_CLIENT_ID"
          )
          
          # AWS SSM GetParameters has a hard limit of 10 names per call.
          INVALID_JSON="[]"
          TOTAL="${#NAMES[@]}"
          INDEX=0
          while [ "${INDEX}" -lt "${TOTAL}" ]; do
            CHUNK=( "${NAMES[@]:${INDEX}:10}" )
            aws ssm get-parameters --region "${AWS_REGION}" --names "${CHUNK[@]}" --output json > ssm-params.json
            INVALID_JSON="$(INVALID_JSON="${INVALID_JSON}" python3 -c 'import json,os; prev=json.loads(os.environ.get("INVALID_JSON","[]")); cur=(json.load(open("ssm-params.json","r",encoding="utf-8")).get("InvalidParameters",[]) or []); merged=sorted(set(prev).union(cur)); print(json.dumps(merged))')"
            INDEX=$((INDEX + 10))
          done

          INVALID_COUNT="$(INVALID_JSON="${INVALID_JSON}" python3 -c 'import json,os; v=json.loads(os.environ.get("INVALID_JSON","[]")); print(len(v))')"
          if [ "${INVALID_COUNT}" != "0" ]; then
            echo "Missing SSM parameters (count=${INVALID_COUNT}). InvalidParameters:"
            INVALID_JSON="${INVALID_JSON}" python3 -c 'import json,os; v=json.loads(os.environ.get("INVALID_JSON","[]")); print(json.dumps(v, indent=2))'
            exit 1
          fi
          echo "SSM parameters OK."

      - name: Deploy to AWS Lambda
        working-directory: backend
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          API_STAGE: production
        run: |
          npx serverless deploy --stage production

      - name: Publish runtime-config.json to frontend buckets
        working-directory: backend
        env:
          RESEARCH_FRONTEND_S3_BUCKET: ${{ secrets.RESEARCH_FRONTEND_S3_BUCKET }}
          PARTICIPANT_FRONTEND_S3_BUCKET: ${{ secrets.PARTICIPANT_FRONTEND_S3_BUCKET }}
          RESEARCH_FRONTEND_CLOUDFRONT_ID: ${{ secrets.RESEARCH_FRONTEND_CLOUDFRONT_ID }}
          PARTICIPANT_FRONTEND_CLOUDFRONT_ID: ${{ secrets.PARTICIPANT_FRONTEND_CLOUDFRONT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RESEARCH_FRONTEND_S3_BUCKET}" ] || [ -z "${PARTICIPANT_FRONTEND_S3_BUCKET}" ]; then
            echo "Missing frontend S3 bucket secrets (RESEARCH_FRONTEND_S3_BUCKET / PARTICIPANT_FRONTEND_S3_BUCKET)"
            exit 1
          fi

          echo "Resolving deployed API base URL from CloudFormation stack output..."
          STACK_NAME="emotioxv3-backend-production"
          API_BASE_URL="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceEndpoint'].OutputValue | [0]" \
            --output text)"

          if [ -z "${API_BASE_URL}" ]; then
            echo "Failed to resolve API base URL from CloudFormation output for stack: ${STACK_NAME}"
            exit 1
          fi

          echo "API base URL: ${API_BASE_URL}"
          printf '{ "apiBaseUrl": "%s" }\n' "${API_BASE_URL}" > runtime-config.json

          echo "Uploading runtime-config.json to frontend buckets..."
          aws s3 cp runtime-config.json "s3://${RESEARCH_FRONTEND_S3_BUCKET}/runtime-config.json" --cache-control "no-store, max-age=0"
          aws s3 cp runtime-config.json "s3://${PARTICIPANT_FRONTEND_S3_BUCKET}/runtime-config.json" --cache-control "no-store, max-age=0"

          if [ -n "${RESEARCH_FRONTEND_CLOUDFRONT_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "${RESEARCH_FRONTEND_CLOUDFRONT_ID}" --paths "/runtime-config.json"
          fi
          if [ -n "${PARTICIPANT_FRONTEND_CLOUDFRONT_ID:-}" ]; then
            aws cloudfront create-invalidation --distribution-id "${PARTICIPANT_FRONTEND_CLOUDFRONT_ID}" --paths "/runtime-config.json"
          fi
