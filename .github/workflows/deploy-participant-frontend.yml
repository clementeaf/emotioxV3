name: Deploy Participant Frontend to S3/CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'participant-frontend/**'
      - '.github/workflows/deploy-participant-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to S3 and CloudFront
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: participant-frontend/package-lock.json

      - name: Install dependencies
        working-directory: participant-frontend
        run: npm ci

      - name: Build for production
        working-directory: participant-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_PRODUCTION }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        working-directory: participant-frontend
        run: |
          aws s3 sync dist/ s3://${{ secrets.PARTICIPANT_FRONTEND_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PARTICIPANT_FRONTEND_CLOUDFRONT_ID }} \
            --paths "/*"
