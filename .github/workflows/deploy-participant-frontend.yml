name: Deploy Participant Frontend to S3/CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'participant-frontend/**'
      - '.github/workflows/deploy-participant-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to S3 and CloudFront
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: participant-frontend/package-lock.json

      - name: Install dependencies
        working-directory: participant-frontend
        run: npm ci

      - name: Build for production
        working-directory: participant-frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 with correct Content-Types
        working-directory: participant-frontend
        run: |
          # Sync files first
          aws s3 sync dist/ s3://${{ secrets.PARTICIPANT_FRONTEND_S3_BUCKET }} --delete --exclude "runtime-config.json"
          
          # Fix Content-Type headers for different file types
          python3 << 'PY'
          import subprocess
          import os
          import mimetypes
          
          bucket = "${{ secrets.PARTICIPANT_FRONTEND_S3_BUCKET }}"
          dist_dir = "dist"
          
          # MIME type mappings
          mime_types = {
              '.js': 'application/javascript',
              '.mjs': 'application/javascript',
              '.json': 'application/json',
              '.css': 'text/css',
              '.html': 'text/html',
              '.svg': 'image/svg+xml',
              '.png': 'image/png',
              '.jpg': 'image/jpeg',
              '.jpeg': 'image/jpeg',
              '.gif': 'image/gif',
              '.webp': 'image/webp',
              '.woff': 'font/woff',
              '.woff2': 'font/woff2',
              '.ttf': 'font/ttf',
              '.eot': 'application/vnd.ms-fontobject',
              '.otf': 'font/otf',
              '.ico': 'image/x-icon',
              '.xml': 'application/xml',
              '.txt': 'text/plain',
          }
          
          def get_content_type(file_path):
              ext = os.path.splitext(file_path)[1].lower()
              return mime_types.get(ext, 'application/octet-stream')
          
          # Walk through dist directory and update Content-Type for each file
          for root, dirs, files in os.walk(dist_dir):
              for file in files:
                  file_path = os.path.join(root, file)
                  rel_path = os.path.relpath(file_path, dist_dir)
                  content_type = get_content_type(file_path)
                  
                  s3_path = f"s3://{bucket}/{rel_path}"
                  cmd = [
                      'aws', 's3', 'cp', file_path, s3_path,
                      '--content-type', content_type,
                      '--metadata-directive', 'REPLACE'
                  ]
                  
                  subprocess.run(cmd, check=False)
          
          print("✓ Content-Type headers updated")
          PY

      - name: Invalidate CloudFront cache
        run: |
          echo "Creating CloudFront invalidation for all paths..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PARTICIPANT_FRONTEND_CLOUDFRONT_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation created: $INVALIDATION_ID"
          echo "Waiting for invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.PARTICIPANT_FRONTEND_CLOUDFRONT_ID }} \
            --id "$INVALIDATION_ID"
          echo "✓ CloudFront cache invalidated successfully"
