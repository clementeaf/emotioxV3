name: Deploy Research Frontend to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'research-frontend/**'
      - '.github/workflows/deploy-research-frontend-cpanel.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: research-frontend/package-lock.json

      - name: Install dependencies
        working-directory: research-frontend
        run: npm install --prefer-offline --no-audit --include=optional

      - name: Clean previous build
        working-directory: research-frontend
        run: rm -rf dist node_modules/.vite

      - name: Configure runtime-config.json
        working-directory: research-frontend
        run: |
          cat > public/runtime-config.json << 'EOF'
          {
            "apiBaseUrl": "https://emotio.cx/api",
            "participantBaseUrl": "https://emotio.cx/participant"
          }
          EOF

      - name: Build for production
        working-directory: research-frontend
        env:
          VITE_PARTICIPANT_FRONTEND_URL: ${{ secrets.VITE_PARTICIPANT_FRONTEND_URL }}
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT || '22' }} -H ${{ secrets.CPANEL_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup on remote server
        run: |
          ssh -p ${{ secrets.CPANEL_SSH_PORT || '22' }} ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} '
            REMOTE_DIR="$HOME/public_html/research"
            if [ -d "$REMOTE_DIR" ]; then
              BACKUP_DIR="${REMOTE_DIR}.backup.$(date +%Y%m%d_%H%M%S)"
              cp -r "$REMOTE_DIR" "$BACKUP_DIR"
              echo "✅ Backup creado: $BACKUP_DIR"
            else
              mkdir -p "$REMOTE_DIR"
              echo "✅ Directorio creado"
            fi
          '

      - name: Clean remote directory
        run: |
          ssh -p ${{ secrets.CPANEL_SSH_PORT || '22' }} ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} '
            REMOTE_DIR="$HOME/public_html/research"
            cd "$REMOTE_DIR" || exit 1
            find . -mindepth 1 ! -name ".well-known" -exec rm -rf {} + 2>/dev/null || true
            echo "✅ Directorio limpiado"
          '

      - name: Deploy files to cPanel
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.CPANEL_SSH_PORT || '22' }}" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='*.ts' \
            --exclude='*.tsx' \
            --exclude='tsconfig*.json' \
            --exclude='vite.config.ts' \
            --exclude='package*.json' \
            --exclude='.env*' \
            --exclude='.gitignore' \
            --exclude='eslint.config.js' \
            --exclude='tailwind.config.js' \
            --exclude='postcss.config.js' \
            research-frontend/dist/ \
            ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:~/public_html/research/

      - name: Deploy runtime-config.json
        run: |
          scp -P ${{ secrets.CPANEL_SSH_PORT || '22' }} research-frontend/public/runtime-config.json \
            ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:~/public_html/research/runtime-config.json

      - name: Verify deployment
        run: |
          REMOTE_FILES=$(ssh -p ${{ secrets.CPANEL_SSH_PORT || '22' }} ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} 'ls -1 "$HOME/public_html/research" 2>/dev/null | wc -l')
          echo "Archivos en remoto: $REMOTE_FILES"
          if [ "$REMOTE_FILES" -gt 0 ]; then
            echo "✅ Despliegue exitoso"
          else
            echo "⚠️  Advertencia: No se encontraron archivos en el directorio remoto"
            exit 1
          fi
