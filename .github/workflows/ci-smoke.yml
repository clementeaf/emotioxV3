name: CI Smoke

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: emotiox_ci
          MYSQL_USER: emotiox
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (backend)
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Install dependencies (research-frontend)
        working-directory: research-frontend
        run: npm ci

      - name: Install dependencies (participant-frontend)
        working-directory: participant-frontend
        run: npm ci

      - name: Apply DB migrations (MySQL)
        env:
          MYSQL_PWD: password
        run: |
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/001_initial_schema.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/001b_add_missing_tables.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/002_seed_data.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/003_research_techniques.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/004_enterprises.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/005_research_types_techniques_relation.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/006_researches_research_technique_id.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/007_module_templates.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/011_update_responses_table.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/012_add_stages_table.sql
          mysql -h 127.0.0.1 -u emotiox emotiox_ci < database/migrations-mysql/013_add_password_hash_to_users.sql

      - name: Type-check (backend)
        working-directory: backend
        run: npm run type-check

      - name: Type-check (research-frontend)
        working-directory: research-frontend
        run: npm run type-check

      - name: Type-check (participant-frontend)
        working-directory: participant-frontend
        run: npm run type-check

      - name: Run end-to-end smoke
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: emotiox_ci
          DB_USER: emotiox
          DB_PASSWORD: password
          DB_SSL: "false"
          API_STAGE: ci
          SSM_PREFIX: /emotioxv3/ci
          AWS_REGION: us-east-1
        run: npx --yes tsx scripts/smoke_end_to_end.ts

