# Despliega research-frontend a ~/public_html/dev/research para https://dev.emotio.cx/research/
name: Deploy Research Frontend to cPanel (dev)

on:
  push:
    branches:
      - dev
    paths:
      - 'research-frontend/**'
      - '.github/workflows/deploy-research-frontend-cpanel-dev.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy research frontend (dev) to cPanel
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require branch dev
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/dev" ]; then
            echo "::error::Este workflow solo debe ejecutarse en la rama dev (ref actual: ${GITHUB_REF})."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: research-frontend/package-lock.json

      - name: Install dependencies
        working-directory: research-frontend
        run: npm ci

      - name: Clean previous build
        working-directory: research-frontend
        run: rm -rf dist node_modules/.vite

      - name: Configure runtime-config.json (dev.emotio.cx)
        working-directory: research-frontend
        run: |
          cat > public/runtime-config.json << 'EOF'
          {
            "apiBaseUrl": "https://dev.emotio.cx/api",
            "participantBaseUrl": "https://dev.emotio.cx/participant"
          }
          EOF

      - name: Build for production
        working-directory: research-frontend
        env:
          VITE_PARTICIPANT_FRONTEND_URL: https://dev.emotio.cx/participant
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT || '22' }} -H ${{ secrets.CPANEL_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup on remote server
        run: |
          ssh -p ${{ secrets.CPANEL_SSH_PORT || '22' }} ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} '
            REMOTE_DIR="$HOME/public_html/dev/research"
            if [ -d "$REMOTE_DIR" ]; then
              BACKUP_DIR="${REMOTE_DIR}.backup.$(date +%Y%m%d_%H%M%S)"
              cp -r "$REMOTE_DIR" "$BACKUP_DIR"
              echo "Backup creado: $BACKUP_DIR"
            else
              mkdir -p "$REMOTE_DIR"
              echo "Directorio creado"
            fi
          '

      - name: Clean remote directory
        run: |
          ssh -p ${{ secrets.CPANEL_SSH_PORT || '22' }} ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} '
            REMOTE_DIR="$HOME/public_html/dev/research"
            mkdir -p "$REMOTE_DIR"
            cd "$REMOTE_DIR" || exit 1
            find . -mindepth 1 ! -name ".well-known" -exec rm -rf {} + 2>/dev/null || true
            echo "Directorio limpiado"
          '

      - name: Deploy files to cPanel
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.CPANEL_SSH_PORT || '22' }}" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='*.ts' \
            --exclude='*.tsx' \
            --exclude='tsconfig*.json' \
            --exclude='vite.config.ts' \
            --exclude='package*.json' \
            --exclude='.env*' \
            --exclude='.gitignore' \
            --exclude='eslint.config.js' \
            --exclude='tailwind.config.js' \
            --exclude='postcss.config.js' \
            research-frontend/dist/ \
            ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:~/public_html/dev/research/

      - name: Deploy runtime-config.json
        run: |
          scp -P ${{ secrets.CPANEL_SSH_PORT || '22' }} research-frontend/public/runtime-config.json \
            ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:~/public_html/dev/research/runtime-config.json

      - name: Configure .htaccess (SPA)
        run: |
          ssh -p ${{ secrets.CPANEL_SSH_PORT || '22' }} ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} "cat > ~/public_html/dev/research/.htaccess" << 'HTACCESS_EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteRule \.json$ - [L]
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteRule ^ index.html [L]
          </IfModule>

          <IfModule mod_headers.c>
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set X-XSS-Protection "1; mode=block"
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
          </IfModule>

          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/html "access plus 0 seconds"
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
          </IfModule>

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
          </IfModule>
          HTACCESS_EOF

      - name: Verify deployment
        run: |
          REMOTE_FILES=$(ssh -p ${{ secrets.CPANEL_SSH_PORT || '22' }} ${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }} 'ls -1 "$HOME/public_html/dev/research" 2>/dev/null | wc -l')
          echo "Archivos en remoto: $REMOTE_FILES"
          if [ "$REMOTE_FILES" -gt 0 ]; then
            echo "Despliegue (dev) exitoso"
          else
            echo "No se encontraron archivos en public_html/dev/research"
            exit 1
          fi
