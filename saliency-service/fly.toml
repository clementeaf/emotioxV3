app = 'emotiox-saliency'
primary_region = 'gru'

[build]

[env]
  PORT = '8080'
  SALIENCY_SECRET = 'emotiox-saliency-2026'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 2
    soft_limit = 1

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
